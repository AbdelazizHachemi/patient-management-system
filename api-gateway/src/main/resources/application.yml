server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: "http://patient-service:4000"
              predicates:
                - Path=/api/patient,/api/patient/**,/api/patients,/api/patients/**
              filters:
                - StripPrefix=1

            - id: api-docs-patient-service
              uri: "http://patient-service:4000"
              predicates:
                - Path=/api-docs/patients
              filters:
                - name: RewritePath
                  args:
                    regexp: /api-docs/patients
                    replacement: /v3/api-docs

            - id: billing-service
              uri: "http://billing-service:4001"
              predicates:
                - Path=/api/billing/**
              filters:
                - StripPrefix=2

            - id: analytics-service
              uri: "http://analytics-service:4002"
              predicates:
                - Path=/api/analytics/**
              filters:
                - StripPrefix=2